name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy mode
        run: |
          MODE="$(tr -d '[:space:]' < .github/pages-mode.txt)"
          echo "Deploy mode: $MODE"
          if [ "$MODE" = "github" ]; then
            SITE_URL="https://${{ github.repository_owner }}.github.io"
            BASE_PATH="/${{ github.event.repository.name }}"
            echo "PUBLIC_SITE_URL=$SITE_URL" >> $GITHUB_ENV
            echo "PUBLIC_BASE_PATH=$BASE_PATH" >> $GITHUB_ENV
            echo "PUBLIC_FULL_BASE_URL=${SITE_URL}${BASE_PATH}/" >> $GITHUB_ENV
            rm -f public/CNAME
          else
            echo "PUBLIC_SITE_URL=https://inoro.ai" >> $GITHUB_ENV
            echo "PUBLIC_BASE_PATH=/" >> $GITHUB_ENV
            echo "PUBLIC_FULL_BASE_URL=https://inoro.ai/" >> $GITHUB_ENV
            echo "inoro.ai" > public/CNAME
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
