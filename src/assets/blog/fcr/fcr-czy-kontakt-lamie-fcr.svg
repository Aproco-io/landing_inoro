<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <title id="t">Czy ten kontakt łamie FCR?</title>
  <desc id="d">Diagram decyzyjny. Jeśli klient wraca poza oknem czasowym, to nowy kontakt i FCR nie jest złamany. Jeśli wraca w oknie, ale w innej sprawie, to nowa sprawa i FCR nie jest złamany. Jeśli wraca w oknie w tej samej sprawie, FCR jest złamany. Transfer wewnętrzny w pierwszym kontakcie łamie FCR w podejściu restrykcyjnym, a w liberalnym nie, jeśli sprawę zamknięto w tym kontakcie.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="568" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <g transform="translate(-45,0)">
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="280" y1="68" x2="280" y2="98"/>
    <line x1="280" y1="164" x2="280" y2="198"/>
    <line x1="280" y1="264" x2="280" y2="298"/>
    <line x1="430" y1="132" x2="498" y2="132"/>
    <line x1="430" y1="232" x2="498" y2="232"/>
    <line x1="430" y1="464" x2="478" y2="464"/>
  </g>
  <g font-size="13" font-weight="700" fill="#475569">
    <text x="292" y="187">Tak</text>
    <text x="292" y="287">Tak</text>
    <text x="452" y="124">Nie</text>
    <text x="452" y="224">Nie</text>
    <text x="442" y="456">Tak</text>
  </g>
  <rect x="130" y="20" width="300" height="48" rx="24" fill="#0f172a"/>
  <text x="280" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Klient kontaktuje się ponownie</text>
  <rect x="130" y="100" width="300" height="64" rx="10" fill="#e8f6fc" stroke="#1AA7E0" stroke-width="2"/>
  <text x="280" y="127" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Czy powrót mieści się</text>
  <text x="280" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">w oknie czasowym (np. 7 dni)?</text>
  <rect x="130" y="200" width="300" height="64" rx="10" fill="#e8f6fc" stroke="#1AA7E0" stroke-width="2"/>
  <text x="280" y="227" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Czy dotyczy tej samej sprawy?</text>
  <text x="280" y="248" text-anchor="middle" font-size="13" fill="#475569">powód kontaktu, nr zgłoszenia, transkrypcja</text>
  <rect x="500" y="100" width="230" height="64" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="615" y="127" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Nie łamie FCR</text>
  <text x="615" y="148" text-anchor="middle" font-size="13" fill="#065f46">to nowy kontakt</text>
  <rect x="500" y="200" width="230" height="64" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="615" y="227" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Nie łamie FCR</text>
  <text x="615" y="248" text-anchor="middle" font-size="13" fill="#065f46">to nowa sprawa</text>
  <rect x="130" y="300" width="300" height="64" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="280" y="327" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Łamie FCR</text>
  <text x="280" y="348" text-anchor="middle" font-size="13" fill="#991b1b">powtórny kontakt w tej samej sprawie</text>
  <line x1="85" y1="394" x2="765" y2="394" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="130" y="420" font-size="13" font-weight="700" fill="#475569">Osobna decyzja: transfer wewnętrzny</text>
  <rect x="130" y="432" width="300" height="64" rx="10" fill="#e8f6fc" stroke="#1AA7E0" stroke-width="2"/>
  <text x="280" y="459" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Czy w pierwszym kontakcie</text>
  <text x="280" y="480" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">był transfer wewnętrzny?</text>
  <rect x="480" y="418" width="250" height="94" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="605" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Zależy od definicji</text>
  <text x="605" y="464" text-anchor="middle" font-size="13" fill="#92400e">restrykcyjna: łamie FCR</text>
  <text x="605" y="484" text-anchor="middle" font-size="13" fill="#92400e">liberalna: nie łamie, jeśli sprawę</text>
  <text x="605" y="502" text-anchor="middle" font-size="13" fill="#92400e">zamknięto w tym kontakcie</text>
  </g>
  <text x="380" y="546" text-anchor="middle" font-size="13" fill="#64748b">Okno czasowe, definicję sprawy i podejście do transferów ustal przed pierwszym pomiarem.</text>
</svg>
